name: smoke
on:
  push:
    paths: ["repro/**",
            ".github/workflows/smoke.yml"]
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pytest
      - run: python3 -m pytest repro/tests/ -q
      - run: bash repro/data_restore/fetch.sh data
      - run: python3 repro/experiments/run_e2.py --data data --traces conv
          --seeds 0 --days 6 --max-rows 300000 --out /tmp/smoke_e2.csv
      - run: python3 repro/analysis/tables.py /tmp/smoke_e2.csv local
      - run: python3 repro/analysis/verify.py /tmp/smoke_e2.csv
